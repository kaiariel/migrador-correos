; Configuración del migrador. Lo normal es completarla desde la interfaz (Migrador.bat),
; que reescribe config.ini al guardar. Este archivo solo sirve de modelo para la terminal.

[origen]
; Proveedor: cpanel, hostinger, gmail, zoho, ionos, titan, godaddy, yahoo u otro
proveedor = cpanel
servidor = mail.tudominio.com
puerto = 993
; seguridad: ssl (puerto 993), starttls (puerto 143) o ninguna
seguridad = ssl
verificar_certificado = si

[destino]
proveedor = hostinger
servidor = imap.hostinger.com
puerto = 993
seguridad = ssl
verificar_certificado = si

[general]
; Mejor en el disco C: que en una carpeta sincronizada (Drive, OneDrive).
carpeta_respaldo = C:\MigracionCorreos\respaldo
; Carpetas que no se copian, separadas por comas (p. ej. Trash, Spam).
excluir_carpetas =
; Cuentas en paralelo: 2 o 3 es seguro.
cuentas_a_la_vez = 2
; Tamaño de cada tanda de descarga, en MB.
lote_mb = 20
